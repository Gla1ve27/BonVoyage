<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Modal</title>
    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        /* Overlay styling */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Popup styling */
        .popup {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            text-align: center;
            z-index: 11;
        }

        .popup h2 {
            margin: 0 0 15px;
            font-size: 1.5rem;
        }

        .popup p {
            font-size: 1rem;
            margin: 0 0 20px;
        }

        .popup button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup button:hover {
            background-color: #d32f2f;
        }

        /* Ensure focus on the popup */
        .focused {
            outline: 2px solid #e63946;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <!-- Trigger Button -->
    <button id="openPopup" style="padding: 10px 20px; font-size: 1rem;">Open Popup</button>

    <!-- Popup Overlay -->
    <div class="overlay" id="popupOverlay">
        <div class="popup">
            <h2>Popup Title</h2>
            <p>This is the popup content. You can include anything here!</p>
            <button id="closePopup">Close</button>
        </div>
    </div>

    <script>
        // JavaScript for handling popup
        const openPopup = document.getElementById('openPopup');
        const closePopup = document.getElementById('closePopup');
        const popupOverlay = document.getElementById('popupOverlay');

        // Function to show the popup
        openPopup.addEventListener('click', () => {
            popupOverlay.style.display = 'flex'; // Show overlay
            const popup = popupOverlay.querySelector('.popup');
            popup.classList.add('focused'); // Add focus to the popup
            popup.focus(); // Ensure the popup gets focus
        });

        // Function to hide the popup
        closePopup.addEventListener('click', () => {
            popupOverlay.style.display = 'none'; // Hide overlay
        });

        // Close popup when clicking outside of it
        popupOverlay.addEventListener('click', (event) => {
            if (event.target === popupOverlay) {
                popupOverlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
